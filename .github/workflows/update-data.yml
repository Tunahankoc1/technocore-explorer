name: Update room snapshot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}       # allows manual "Run workflow" too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest /rooms snapshot from technocore.chat
        run: |
          mkdir -p data
          curl -sS --fail \
            -A "technocore-explorer (https://github.com/${{ github.repository }})" \
            https://technocore.chat/rooms -o data/rooms.txt
          printf '\n# fetched_at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> data/rooms.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rooms.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh rooms snapshot [skip ci]"
            git push
          fi
